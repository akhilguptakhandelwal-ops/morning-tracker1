name: 🌅 Morning Intelligence Tracker

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST = 1:30 AM UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-tracker:
    name: Scrape → Summarise → Email
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # needed to commit sent_log.json back to repo

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🚀 Run Morning Intelligence Tracker
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GAS_WEBHOOK_URL:   ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_TOKEN:  ${{ secrets.GAS_SECRET_TOKEN }}
        run: python morning_tracker.py

      - name: 💾 Commit sent_log.json back to repo
        run: |
          git config user.name  "Morning Tracker Bot"
          git config user.email "bot@morning-tracker"
          git add sent_log.json || true
          git diff --staged --quiet || git commit -m "📨 Update sent email log [$(date +'%Y-%m-%d %H:%M')]"
          git push || true

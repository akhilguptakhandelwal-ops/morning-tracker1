name: 🌅 Morning Intelligence Tracker

on:
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST = 1:30 AM UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-tracker:
    name: Scrape → Summarise → Email
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🔄 Reset state for fresh run
        run: |
          python -c "
          import sqlite3
          conn = sqlite3.connect('tracker.db')
          conn.execute('UPDATE sources SET last_scraped_id=NULL')
          conn.commit()
          print('State reset — all sources will reprocess ✅')
          "

      - name: 🚀 Run Morning Intelligence Tracker
        env:
          GEMINI_API_KEY:    ${{ secrets.GEMINI_API_KEY }}
          GAS_WEBHOOK_URL:   ${{ secrets.GAS_WEBHOOK_URL }}
          GAS_SECRET_TOKEN:  ${{ secrets.GAS_SECRET_TOKEN }}
        run: python morning_tracker.py
